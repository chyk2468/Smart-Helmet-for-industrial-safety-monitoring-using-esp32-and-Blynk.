<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart-Helmet-for-industrial-safety-monitoring-using-esp32-and-Blynk. Architecture</title><style>:root{--bg:#F4F1EB;--ink:#26332F;--muted:#6F7B75;--line:#D8D8D1;--card:#FFFFFF;--a:#D47732;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);padding:clamp(20px,4vw,56px)}main{max-width:1200px;margin:auto}.tag{color:var(--a);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;font-weight:800}h1{font-size:clamp(2rem,5vw,3rem)}p{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:36px 0}.stage{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px 18px;min-height:205px;text-align:left;cursor:pointer;transition:transform .25s,border-color .25s}.stage:before{content:'';display:block;width:36px;height:4px;background:var(--a);margin-bottom:18px}.stage:hover,.stage:focus-visible,.stage[aria-pressed=true]{transform:translateY(-5px);border-color:var(--a);outline:none}.stage h2{font-size:1.1rem}.stage p{font-size:.9rem}.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;min-height:120px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important}}</style></head><body><main><div class="tag">Interactive architecture</div><h1>Smart-Helmet-for-industrial-safety-monitoring-using-esp32-and-Blynk.</h1><p>Choose a stage to inspect its role.</p><section class="grid"><button class="stage" type="button" aria-pressed="true" data-i="0"><span class="tag">Stage 1 / INPUT</span><h2>Provide input</h2><p>Supply the required input.</p></button><button class="stage" type="button" aria-pressed="false" data-i="1"><span class="tag">Stage 2 / PREPARE</span><h2>Prepare data</h2><p>Validate and prepare the input.</p></button><button class="stage" type="button" aria-pressed="false" data-i="2"><span class="tag">Stage 3 / PROCESS</span><h2>Run project logic</h2><p>Execute the main processing stage.</p></button><button class="stage" type="button" aria-pressed="false" data-i="3"><span class="tag">Stage 4 / OUTPUT</span><h2>Review result</h2><p>Inspect the result.</p></button></section><section class="detail" aria-live="polite"><h2 id="heading">Provide input</h2><p id="body">Supply the required input.</p></section><p><a style="color:var(--a)" href="https://github.com/chyk2468/Smart-Helmet-for-industrial-safety-monitoring-using-esp32-and-Blynk.">View source repository</a></p></main><script>const stages=[["INPUT","Provide input","Supply the required input."],["PREPARE","Prepare data","Validate and prepare the input."],["PROCESS","Run project logic","Execute the main processing stage."],["OUTPUT","Review result","Inspect the result."]];document.querySelectorAll('.stage').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.stage').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.querySelector('#heading').textContent=stages[+b.dataset.i][1];document.querySelector('#body').textContent=stages[+b.dataset.i][2]}))</script></body></html>
